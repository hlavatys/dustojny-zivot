<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Děkujeme — Důstojný život</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --navy:#1E3A5F;
    --navy-deep:#12233A;
    --gold:#C69C4A;
    --gold-soft:#E4C77E;
    --cream:#F6EFDE;
    --ivory:#FFFDF8;
    --text:#222222;
    --text-soft:#4A473F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia, 'Times New Roman', serif;
    background:var(--cream);
    color:var(--text);
    font-size:20px;
    line-height:1.65;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .box{max-width:480px;}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;}
  .brand svg{width:44px;height:44px;}
  .brand span{font-weight:700;font-size:24px;color:var(--navy);}
  h1{color:var(--navy);font-size:28px;margin:0 0 16px;}
  p{color:var(--text-soft);font-size:19px;margin:0 0 28px;}
  a.phone{
    display:inline-block;
    background:var(--gold);
    color:var(--navy-deep);
    text-decoration:none;
    font-weight:700;
    font-size:20px;
    padding:14px 28px;
    border-radius:4px;
  }
  .email-line{margin-top:16px;font-size:17px;}
  .email-line a{color:var(--navy);text-decoration:none;}
  a.back{display:block;margin-top:20px;color:var(--navy);font-size:16px;}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none"><path d="M6 30 32 8l26 22" stroke="#C69C4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M12 27v29h40V27" stroke="#1E3A5F" stroke-width="4" stroke-linejoin="round" fill="none"/><path d="M32,53 C25,47 20,41 20,35 C20,30 24,27 28,29 C30,30 31,32 32,34 C33,32 34,30 36,29 C40,27 44,30 44,35 C44,41 39,47 32,53 Z" fill="#C69C4A"/></svg>
      <span>Důstojný život</span>
    </div>
    <h1>Děkujeme za váš zájem</h1>
    <p>Vaši zprávu jsme zaznamenali. Ozveme se vám co nejdříve, obvykle do jednoho pracovního dne. Pokud to spěchá, můžete nám rovnou zavolat.</p>
    <a class="phone" href="tel:+420732888546">📞 732 888 546</a>
    <div class="email-line">✉️ <a href="mailto:dustojny-zivot@seznam.cz">dustojny-zivot@seznam.cz</a></div>
    <a class="back" href="/">← Zpět na hlavní stránku</a>
  </div>
</body>
</html>
